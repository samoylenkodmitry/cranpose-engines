[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
exclude = ["templates"]

[workspace.package]
# The published crates' version, which the release tag sets
# (scripts/release-version.py).
version = "0.1.8"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/samoylenkodmitry/cranpose-engines"
publish = false

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
cranpose = { version = "0.12.0", default-features = false }
cranpose-bevy = { path = "crates/cranpose-bevy", version = "0.1.8" }
cranpose-godot = { path = "crates/cranpose-godot", version = "0.1.8" }
cranpose-gpu-interop = { path = "crates/cranpose-gpu-interop", version = "0.1.8" }
demo-scene = { path = "examples/demo-scene" }
demo-ui = { path = "examples/demo-ui" }
godot = { version = "0.5.5", features = ["api-4-7"] }
nature = { path = "examples/nature" }
wgpu = { version = "30", default-features = false }

# Bevy requires crates.io's wgpu. Cranpose takes the same one on desktop and
# its fork on the web, so the web demos resolve crates.io's wgpu to the fork.
# A patch applies to every target, so the desktop demos build on the fork too;
# the templates, as a desktop project would, build without it.
[patch.crates-io]
wgpu = { path = "wgpu-shim" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The downloads: no symbols, and thin link-time optimisation for size.
[profile.release]
strip = true
lto = "thin"

# The web bundles: small first, since a page downloads all of it.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
