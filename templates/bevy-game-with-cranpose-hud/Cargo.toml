[package]
name = "bevy-game-with-cranpose-hud"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
] }
cranpose = { version = "0.17.2", default-features = false, features = [
    "renderer-wgpu",
    "embedded-default-font",
] }
cranpose-bevy = "0.1.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Bevy builds against crates.io's wgpu, and Cranpose renders with its fork of
# wgpu on every target. This package is named `wgpu` and re-exports the fork,
# so Bevy and Cranpose share one `wgpu::Device` type.
[patch.crates-io]
wgpu = { git = "https://github.com/samoylenkodmitry/cranpose-engines", branch = "main" }

[workspace]
