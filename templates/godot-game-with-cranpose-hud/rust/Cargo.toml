[package]
name = "godot-game-hud"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cranpose = { version = "0.17.2", default-features = false, features = [
    "renderer-wgpu",
    "embedded-default-font",
] }
cranpose-godot = "0.1.9"
godot = { version = "0.5.5", features = ["api-4-7"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The engine crates take crates.io's wgpu, and Cranpose renders with its fork of
# wgpu on every target. This package is named `wgpu` and re-exports the fork,
# so both share one `wgpu::Device` type.
[patch.crates-io]
wgpu = { git = "https://github.com/samoylenkodmitry/cranpose-engines", branch = "main" }

[workspace]
