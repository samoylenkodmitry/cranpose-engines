[package]
name = "godot-game-hud"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cranpose = { version = "0.13.0", default-features = false, features = [
    "renderer-wgpu",
    "embedded-default-font",
] }
cranpose-godot = "0.1.9"
godot = { version = "0.5.5", features = ["api-4-7"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
