[package]
name = "cranpose-app-with-bevy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "multi_threaded",
    "std",
] }
cranpose = { version = "0.9.41", default-features = false, features = [
    "desktop",
    "renderer-wgpu",
    "embedded-default-font",
] }
cranpose-bevy = { git = "https://github.com/samoylenkodmitry/cranpose-engines", tag = "v0.1.5" }

# Bevy requires crates.io's wgpu; this resolves it to the wgpu fork Cranpose
# uses, so Bevy and Cranpose share one device.
[patch.crates-io]
wgpu = { git = "https://github.com/samoylenkodmitry/cranpose-engines", tag = "v0.1.5" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
