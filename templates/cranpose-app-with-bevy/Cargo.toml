[package]
name = "cranpose-app-with-bevy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "multi_threaded",
    "std",
] }
cranpose = { version = "0.13.0", default-features = false, features = [
    "desktop",
    "renderer-wgpu",
    "embedded-default-font",
] }
cranpose-bevy = "0.1.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
