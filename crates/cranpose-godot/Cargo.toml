[package]
name = "cranpose-godot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cranpose in Godot 4: a composition drawn over Godot's frame on Godot's Metal device, with Godot's input"

[dependencies]
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
cranpose-gpu-interop = { workspace = true, features = ["godot"] }
godot = { workspace = true }
wgpu = { package = "cranpose-wgpu", version = "30.0.16", default-features = false }
