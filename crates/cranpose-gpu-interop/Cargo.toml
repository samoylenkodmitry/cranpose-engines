[package]
name = "cranpose-gpu-interop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wgpu devices and textures made from another renderer's native GPU objects; the one Cranpose crate with unsafe code"
readme = "../../README.md"
keywords = ["wgpu", "metal", "webgl", "godot", "cranpose"]
categories = ["graphics", "game-development"]

[features]
godot = ["dep:godot", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

[dependencies]
cranpose = { workspace = true, features = ["renderer-wgpu"] }
pollster = "0.4"
thiserror = "2"

# Cranpose's wgpu on each target: crates.io's on desktop and Cranpose's fork
# on the web, Android and iOS.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
wgpu = { workspace = true, features = ["metal", "std", "wgsl"] }

[target.'cfg(any(target_arch = "wasm32", target_os = "android", target_os = "ios"))'.dependencies]
wgpu = { package = "cranpose-wgpu", version = "30.0.20", default-features = false, features = ["metal", "std", "wgsl"] }

# A web export's module, such as Godot's, draws with the GL context its host
# made current.
[target.'cfg(target_os = "emscripten")'.dependencies]
glow = "0.18"
wgpu = { package = "cranpose-wgpu", version = "30.0.20", default-features = false, features = ["gles", "fragile-send-sync-non-atomic-wasm"] }
wgpu-hal = { package = "cranpose-wgpu-hal", version = "30.0.15", features = ["gles"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# Godot's Metal device, for `godot`. On the web, Godot shares its WebGL2
# context through `gl`, which needs no Godot API.
godot = { workspace = true, optional = true }
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, optional = true, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3.2", default-features = false, optional = true, features = [
    "std",
    "MTLDevice",
    "MTLCommandQueue",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
    "MTLPixelFormat",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLBlitCommandEncoder",
    "MTLEvent",
    "MTLLibrary",
    "MTLRenderPipeline",
    "MTLRenderPass",
    "MTLRenderCommandEncoder",
] }
