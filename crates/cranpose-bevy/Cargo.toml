[package]
name = "cranpose-bevy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bevy and Cranpose on one wgpu device: Bevy scenes inside Cranpose layouts, Cranpose HUDs over Bevy scenes"
readme = "../../README.md"
keywords = ["bevy", "cranpose", "gui", "ui", "hud"]
categories = ["game-development", "gui"]

[features]
# For a build that also turns on Bevy's `bevy_winit`, such as one with a Bevy
# game window: BevyView then leaves Bevy's window plugin out.
bevy_winit = ["bevy/bevy_winit"]

[dependencies]
bevy = { workspace = true, features = [
    "default_app",
    "3d_bevy_render",
    "mesh_picking",
    "multi_threaded",
    "std",
] }
cranpose = { workspace = true, features = ["renderer-wgpu"] }

# Cranpose's wgpu on each target: crates.io's on desktop, which Bevy shares
# without a patch, and Cranpose's fork on the web, Android and iOS.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
wgpu = { workspace = true }

[target.'cfg(any(target_arch = "wasm32", target_os = "android", target_os = "ios"))'.dependencies]
wgpu = { package = "cranpose-wgpu", version = "30.0.24", default-features = false }

# Bevy's PBR shaders name textures with `let`, which Safari's WGSL compiler
# rejects; the fork rewrites those shaders for such browsers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { package = "cranpose-wgpu", version = "30.0.24", default-features = false, features = ["portable-wgsl"] }

[dev-dependencies]
cranpose = { workspace = true, features = ["renderer-wgpu"] }
