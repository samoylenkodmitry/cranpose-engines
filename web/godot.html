<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0e16; overscroll-behavior: none; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; background: #0c0e16; color: #e6e9ef; font: 400 0.95rem/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #boot[hidden] { display: none; }
    #boot .spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(230, 233, 239, 0.18); border-top-color: #8e7cff; animation: spin 0.9s linear infinite; }
    #boot.error .detail { color: #ffb4b4; max-width: 34rem; overflow-wrap: anywhere; }
    #boot button { font: inherit; color: #e6e9ef; background: #2a2f45; border: 1px solid #4a5170; border-radius: 999px; padding: 8px 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="boot">
    <div class="spinner"></div>
    <div class="detail">Loading Godot&hellip;</div>
  </div>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    const boot = document.getElementById("boot");
    const canvas = document.getElementById("canvas");

    function fail(message, reload) {
      boot.hidden = false;
      boot.classList.add("error");
      boot.querySelector(".spinner")?.remove();
      boot.querySelector(".detail").textContent = message;
      if (reload && !boot.querySelector("button")) {
        const button = document.createElement("button");
        button.textContent = "Reload";
        button.addEventListener("click", () => location.reload());
        boot.append(button);
      }
    }

    function stopped(error) {
      fail(`The example stopped: ${String(error?.message ?? error)}`, true);
    }

    // A browser can take the GPU away, for one when its GPU process runs
    // out of memory and restarts. The example cannot go on without it.
    canvas.addEventListener("webglcontextlost", () => fail("The browser took the GPU away from the example. Reload to start it again.", true));

    // `?scene=window` shows Godot's scene inside a Cranpose window; the
    // default is the Cranpose HUD over Godot's scene. `touch` tells the game
    // that the page's main pointer is a finger.
    const inWindow = new URLSearchParams(location.search).get("scene") === "window";
    const touch = matchMedia("(pointer: coarse)").matches;
    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
    if (missing.length !== 0) {
      fail(`This example needs ${missing.join(", ")}, which this browser does not have.`, false);
    } else {
      const engine = new Engine(GODOT_CONFIG);
      window.addEventListener("error", (event) => stopped(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => stopped(event.reason));
      engine.startGame({
        args: ["--", ...(inWindow ? ["window"] : []), ...(touch ? ["touch"] : [])],
        onProgress: (current, total) => {
          if (current > 0 && total > 0) {
            boot.querySelector(".detail").textContent = `Loading Godot… ${Math.round((100 * current) / total)}%`;
          }
        },
      }).then(() => {
        boot.hidden = true;
        canvas.focus();
      }, stopped);
    }
  </script>
</body>
</html>
