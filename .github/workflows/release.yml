name: Release

# A version tag at the head of main sets the published crates' version,
# publishes them to crates.io and attaches the example builds to the tag's
# release.
on:
  push:
    tags: ["v*"]

# One release at a time, never cancelled: a release that has published some
# crates must publish the rest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag's version goes into the manifests, the templates and the README.
  # When they named another version, the change lands on main and the tag
  # moves onto it. A push made with GITHUB_TOKEN starts no workflow, so the
  # moved tag runs no second release.
  version:
    name: Set the version from the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "$TAG must be the head of main." >&2
            exit 1
          fi
          scripts/release-version.py "$TAG"
          if git diff --quiet; then
            exit 0
          fi
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $TAG [skip ci]"
          git push origin HEAD:main
          git tag -f "$TAG" HEAD
          git push -f origin "refs/tags/$TAG"

  bevy:
    name: Bevy examples (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.ref_name }}
      - name: Install Bevy's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev
      # wgpu's DXC (mach-dxcompiler-rs) asks the GitHub API whether its
      # release is immutable before downloading it. Without a token, the
      # runners share one rate limit and the build fails when it is spent.
      - name: Give curl the job's GitHub token
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$RUNNER_TEMP/.curlrc"
          echo "CURL_HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p bevy-in-cranpose -p cranpose-hud-bevy
      - name: Package
        shell: bash
        run: scripts/package-bevy.sh "${{ matrix.name }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: bevy-${{ matrix.name }}
          path: dist/*

  godot:
    name: Godot example (macos-arm64)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p cranpose-godot-demo
      - name: Package
        run: scripts/package-godot.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: godot-macos-arm64
          path: dist/*

  # In dependency order. A version crates.io already has is skipped, so a
  # rerun after a partial publish publishes the rest.
  publish:
    name: Publish to crates.io
    needs: [bevy, godot]
    runs-on: macos-15
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for crate in cranpose-gpu-interop cranpose-godot cranpose-bevy; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "cranpose-engines release" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is on crates.io already." ;;
              404) cargo publish -p "$crate" ;;
              *) echo "crates.io answered $status for $crate $version." >&2; exit 1 ;;
            esac
          done

  release:
    name: Release
    needs: [bevy, godot]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
