[package]
name = "cranpose-hud-bevy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A Bevy game with a Cranpose HUD drawn on Bevy's wgpu device"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
web = ["bevy/webgpu", "dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
bevy = { workspace = true, features = ["default_app", "default_platform", "3d_bevy_render"] }
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
cranpose-bevy = { workspace = true, features = ["bevy_winit"] }
demo-scene = { workspace = true }
demo-ui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
