[package]
name = "cranpose-hud-bevy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A Bevy game with a Cranpose HUD drawn on Bevy's wgpu device"

[lib]
crate-type = ["cdylib", "rlib"]


# The web build's wasm-opt pass (`scripts/build-web.sh`, profile `web`). Its
# feature defaults lag the compiler's, so it gets the features rustc emits for
# wasm32: bulk memory and the others every browser with WebGL2 runs.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
    "-Os",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]

[features]
# The page has two builds: `webgpu` for browsers with WebGPU and `webgl2`
# for the others. `scripts/build-web.sh` builds both.
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]
webgpu = ["web", "bevy/webgpu"]
webgl2 = ["web", "demo-scene/webgl2"]

[dependencies]
bevy = { workspace = true, features = ["default_app", "default_platform", "3d_bevy_render"] }
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
cranpose-bevy = { workspace = true, features = ["bevy_winit"] }
demo-scene = { workspace = true }
demo-ui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
