[package]
name = "cranpose-godot-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Godot demo extension: a Cranpose HUD over Godot's 3D valley, and the valley inside a Cranpose window"

[lib]
crate-type = ["cdylib"]

[dependencies]
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
cranpose-godot = { workspace = true }
demo-ui = { workspace = true }
godot = { workspace = true }
nature = { workspace = true }

# Cranpose's wgpu on each target: crates.io's on desktop and Cranpose's fork
# on the web, Android and iOS.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
wgpu = { workspace = true }

[target.'cfg(any(target_arch = "wasm32", target_os = "android", target_os = "ios"))'.dependencies]
wgpu = { package = "cranpose-wgpu", version = "30.0.24", default-features = false }
