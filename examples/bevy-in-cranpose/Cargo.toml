[package]
name = "bevy-in-cranpose"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A Bevy 3D scene with shadows and bloom inside a Cranpose window, on one wgpu device"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bevy-in-cranpose"
path = "src/main.rs"
required-features = ["desktop"]


# The web build's wasm-opt pass (`scripts/build-web.sh`, profile `web`). Its
# feature defaults lag the compiler's, so it gets the features rustc emits for
# wasm32: bulk memory and the others every browser with WebGPU runs.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = [
    "-Os",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]

[features]
default = ["desktop"]
desktop = ["cranpose/desktop"]
web = [
    "cranpose/web",
    "bevy/webgpu",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:console_error_panic_hook",
]

[dependencies]
bevy = { workspace = true, features = ["default_app", "3d_bevy_render", "multi_threaded", "std"] }
cranpose = { workspace = true, features = ["renderer-wgpu", "embedded-default-font"] }
cranpose-bevy = { workspace = true }
demo-scene = { workspace = true }
demo-ui = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
