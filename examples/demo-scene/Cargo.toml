[package]
name = "demo-scene"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Bevy scene the engine examples draw: a valley with an atmosphere, cascaded shadows, fog and bloom, and an old computer with a Cranpose screen"

[dependencies]
bevy = { workspace = true, features = ["default_app", "3d_bevy_render", "multi_threaded", "std"] }
cranpose-bevy = { workspace = true }
demo-ui = { workspace = true }
nature = { workspace = true }

[features]
# For Bevy on WebGL2, which has no compute shaders: a plain sky in place of
# the atmosphere.
webgl2 = ["bevy/webgl2"]
